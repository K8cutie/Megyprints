<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Yayamove maid silhouette logo">
  <defs>
    <linearGradient id="ymBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82f6"/>
      <stop offset="0.55" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="ymFig" x1="256" y1="120" x2="256" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>

  <!-- rounded badge -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#ymBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="#0b1220" opacity="0.06"/>

  <!-- maid silhouette: head + cap + shoulders + apron -->
  <g fill="url(#ymFig)">
    <!-- ruffled maid cap -->
    <path d="M192 146c0-12 12-22 28-25 8-14 22-23 36-23s28 9 36 23c16 3 28 13 28 25 0 7-5 12-12 13-6 7-16 11-28 12h-48c-12-1-22-5-28-12-7-1-12-6-12-13z"/>
    <!-- head -->
    <circle cx="256" cy="196" r="52"/>
    <!-- neck -->
    <rect x="240" y="240" width="32" height="30" rx="10"/>
    <!-- shoulders / dress -->
    <path d="M168 470c0-58 30-104 74-122 4 10 8 14 14 14s10-4 14-14c44 18 74 64 74 122z"/>
    <!-- apron -->
    <path d="M222 358c0-10 15-18 34-18s34 8 34 18v70c0 8-6 14-14 14h-40c-8 0-14-6-14-14z" fill="#bfdbfe"/>
    <!-- apron tie -->
    <path d="M222 360h68l-8-16h-52z" fill="#93c5fd"/>
  </g>
</svg>
