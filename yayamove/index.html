<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/maid-silhouette.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1d4ed8" />
    <!--
      Baseline Content Security Policy. A real response header at the host/CDN is
      preferred (can include frame-ancestors); this meta is the in-app floor.
      Adjust connect-src to your Supabase project ref + add a nonce if you drop
      'unsafe-inline'. style-src needs 'unsafe-inline' for Tailwind/styled bits.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    />
    <meta
      name="description"
      content="Yayamove — find verified maids, carpenters, plumbers, computer technicians, and aircon pros near you in the Philippines. NBI-verified, rated, and ready to help."
    />
    <meta property="og:title" content="Yayamove — Trusted Local Help" />
    <meta
      property="og:description"
      content="Verified household and repair pros near you. Browse profiles or post a job and get quotes."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Yayamove — Trusted Local Help</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
